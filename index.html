<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Yaper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2226%22%20fill%3D%22%23FC6A39%22/%3E%3Cg%20fill%3D%22%23fff%22%3E%3Ccircle%20cx%3D%2229%22%20cy%3D%2233%22%20r%3D%2211%22/%3E%3Ccircle%20cx%3D%2271%22%20cy%3D%2233%22%20r%3D%2211%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2257%22%20rx%3D%2233%22%20ry%3D%2226%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23FC6A39%22%3E%3Ccircle%20cx%3D%2237%22%20cy%3D%2254%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2263%22%20cy%3D%2254%22%20r%3D%225.5%22/%3E%3Cpath%20d%3D%22M42%2063h16a8%209%200%200%201-16%200z%22/%3E%3C/g%3E%3Cpath%20d%3D%22M45.5%2068.5a4.5%203.5%200%200%201%209%200a4.5%203%200%200%201-9%200z%22%20fill%3D%22%23FEDACD%22/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rail:#121214;--side:#121214;--main:#0b0b0d;--card:#1a1a1e;--hover:#1f1f24;--sel:#26262c;--line:#26262b;--tx:#dbdee1;--mut:#949ba4;--dim:#6d6f78;--acc:#FC6A39;--ok:#23a55a;--idle:#f0b232;--dnd:#f23f43;--bad:#f23f43}
html,body{height:100%;background:var(--main);color:var(--tx);font-family:"gg sans","Noto Sans","Segoe UI",Roboto,Arial,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;color:var(--tx);background:#0e0e10;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--acc)}
.hidden{display:none!important}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,#3b44c4 0,transparent 45%),radial-gradient(circle at 80% 80%,#7b2fd1 0,transparent 45%),#0b0b0d;z-index:80}
.lcard{background:#18181b;border:1px solid var(--line);padding:32px;border-radius:12px;width:min(460px,92vw);box-shadow:0 12px 40px #000a}
.lcard h1{text-align:center;font-size:24px;margin-bottom:6px}.lcard p.sub{text-align:center;color:var(--mut);margin-bottom:18px}
label.l{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.02em;margin:14px 0 7px}
.btn{background:var(--acc);color:#fff;padding:11px 16px;border-radius:8px;font-weight:600;width:100%;margin-top:18px;transition:.15s}
.btn:hover{filter:brightness(1.12)}.btn.gray{background:#2b2b31}.btn.red{background:var(--bad)}.btn.sm{width:auto;padding:8px 14px;margin:0;font-size:14px}
.link{color:#00a8fc;font-size:14px}.link:hover{text-decoration:underline}
.err{color:#ff6b6e;font-size:13px;margin-top:10px;min-height:16px}
.gbtn{background:#fff;color:#1e1f22}
/* ---------- layout ---------- */
#app{display:flex;height:100%}
#rail{width:72px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:8px;overflow-y:auto;scrollbar-width:none;flex-shrink:0}
#rail::-webkit-scrollbar{display:none}
.rb{width:48px;height:48px;border-radius:50%;background:#1f1f24;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:border-radius .15s,background .15s;position:relative;flex-shrink:0;color:var(--tx);overflow:visible}
.rb img{width:100%;height:100%;border-radius:inherit;object-fit:cover}
.rb:hover,.rb.on{border-radius:16px}
.rb:hover:not(.img),.rb.on:not(.img){background:var(--acc);color:#fff}
.rb.home{background:#FC6A39;padding:0}.rb.home.on,.rb.home:hover{background:#FC6A39;filter:brightness(1.08)}.rb.home svg{width:40px;height:40px}
.ylogo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;font-size:26px;font-weight:800;color:#fff}.ylogo svg{width:46px;height:46px}
.rb.green{color:var(--ok)}.rb.green:hover{background:var(--ok);color:#fff}
.pill{position:absolute;left:-12px;width:4px;border-radius:0 4px 4px 0;background:#fff;height:0;transition:.15s}
.rb:hover .pill{height:20px}.rb.on .pill{height:40px}
.badge{position:absolute;right:-4px;bottom:-4px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 5px;border:3px solid var(--rail);min-width:20px;text-align:center}
.rsep{width:32px;height:2px;background:var(--line);border-radius:1px;flex-shrink:0}
#side{width:300px;background:var(--side);display:flex;flex-direction:column;border-left:1px solid #0006;flex-shrink:0}
#sideHead{height:52px;display:flex;align-items:center;padding:0 10px 0 16px;border-bottom:1px solid var(--line);gap:8px;flex-shrink:0}
#sideHead .t{flex:1;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#sideHead .hb{color:var(--mut);padding:5px;border-radius:5px}#sideHead .hb:hover{color:var(--tx)}
.findbtn{flex:1;background:#1f1f24;color:var(--tx);border-radius:8px;padding:7px;font-size:13px;font-weight:600}
#sideBody{flex:1;overflow-y:auto;padding:8px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--mut);cursor:pointer;font-weight:500;margin-bottom:2px}
.nav:hover{background:var(--hover);color:var(--tx)}.nav.on{background:var(--sel);color:#fff}
.nav .sp{flex:1}.cnt{background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:16px 8px 6px;font-size:13px;color:var(--mut);font-weight:600}
.sec button{color:var(--mut);font-size:18px;line-height:1}.sec button:hover{color:var(--tx)}
.cat{display:flex;align-items:center;gap:2px;padding:16px 4px 4px;font-size:12px;color:var(--mut);font-weight:600;cursor:pointer}
.cat .sp{flex:1}.cat button{color:var(--mut);font-size:18px;line-height:1;padding:0 4px}.cat:hover{color:var(--tx)}
.ch{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;color:var(--mut);cursor:pointer;margin:1px 0}
.ch .h{font-size:20px;width:20px;text-align:center;color:var(--dim)}
.ch .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch .ia{display:none;gap:4px;color:var(--mut)}.ch:hover .ia,.ch.on .ia{display:flex}
.ch:hover{background:var(--hover);color:var(--tx)}.ch.on{background:var(--sel);color:#fff}
.ch.unread{color:#fff;font-weight:600}
.dm{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;color:var(--mut);cursor:pointer}
.dm:hover{background:var(--hover);color:var(--tx)}.dm.on{background:var(--sel);color:#fff}
.dm .n{flex:1;min-width:0}.dm .n b{display:block;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dm .n small{font-size:12px;color:var(--dim);display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dm .x{visibility:hidden;color:var(--mut)}.dm:hover .x{visibility:visible}
/* user panel */
#up{margin:8px;background:#1a1a1e;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;align-items:center;gap:6px;flex-shrink:0}
#up .who{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:6px;padding:2px;min-width:0}
#up .who:hover{background:var(--hover)}
#up .who .n{min-width:0}#up .who b{display:block;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#up .who small{display:block;font-size:12px;color:var(--mut)}
#up .ub{color:var(--mut);padding:6px;border-radius:6px}#up .ub:hover{background:var(--hover);color:var(--tx)}#up .ub.off{color:var(--bad)}
/* avatars */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;position:relative;background-size:cover;background-position:center}
.st{position:absolute;right:-2px;bottom:-2px;border-radius:50%;border:3px solid var(--side);background:#80848e}
.st.online{background:var(--ok)}.st.idle{background:var(--idle)}.st.dnd{background:var(--dnd)}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--main)}
#top{height:52px;padding:0 12px 0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex-shrink:0}
#top .tt{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
#top .sp{flex:1}#top .tb{color:var(--mut);padding:4px}#top .tb:hover,#top .tb.on{color:var(--tx)}
#top .tab{padding:3px 10px;border-radius:6px;color:var(--mut);font-weight:500;white-space:nowrap}#top .tab:hover{background:var(--hover);color:var(--tx)}#top .tab.on{background:var(--sel);color:#fff}
#top .tab.add{background:var(--acc);color:#fff;font-weight:600}#top .tab.add.on{background:transparent;color:#5be38d}
#top input.srch{width:220px;padding:5px 10px;font-size:13px;background:#0e0e10}
#menuBtn{display:none}
#content{flex:1;display:flex;min-height:0}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:16px 0 8px}
#right{width:340px;border-left:1px solid var(--line);overflow-y:auto;padding:16px;flex-shrink:0}
.msg{display:flex;gap:16px;padding:3px 16px 3px 16px;position:relative;margin-top:14px}
.msg.cont{margin-top:0}.msg:hover{background:#121216}
.msg .lt{width:40px;flex-shrink:0}.msg.cont .lt .av{display:none}
.msg .lt .ht{display:none;font-size:10px;color:var(--dim);text-align:right;padding-top:4px}.msg.cont:hover .lt .ht{display:block}
.msg .bd{min-width:0;flex:1}
.msg .hd{display:flex;gap:8px;align-items:center}.msg .au{font-weight:600;cursor:pointer}.msg .au:hover{text-decoration:underline}
.msg .tm{font-size:12px;color:var(--dim)}
.msg .tx{white-space:pre-wrap;word-wrap:break-word;line-height:1.4;color:#e3e5e8}
.msg .tx .ed{font-size:10px;color:var(--dim)}
.msg .im{max-width:min(400px,100%);max-height:320px;border-radius:8px;margin-top:6px;cursor:pointer;display:block}
.acts{position:absolute;right:16px;top:-14px;background:#1a1a1e;border:1px solid var(--line);border-radius:8px;display:none;padding:2px}
.msg:hover .acts{display:flex}.acts button{padding:5px 7px;color:var(--mut);border-radius:5px}.acts button:hover{background:var(--hover);color:#fff}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rx span{background:#1f1f24;border-radius:8px;padding:2px 8px;font-size:13px;cursor:pointer;border:1px solid transparent}
.rx span.mine{border-color:var(--acc);background:#2a2d55}
.chwel{padding:16px}.chwel .big{width:68px;height:68px;border-radius:50%;background:#26262c;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:10px}
.chwel h2{font-size:30px;margin-bottom:4px}.chwel p{color:var(--mut)}
.welcome{max-width:420px;margin:auto;text-align:center;padding:20px}
.welcome h2{font-size:28px;line-height:1.25;margin-bottom:8px}.welcome p{color:var(--mut);font-size:14px;margin-bottom:16px}
.step{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:8px;font-weight:600;font-size:14px;cursor:pointer;text-align:left;width:100%}
.step:hover{background:#222227}.step .e{font-size:20px}.step .sp{flex:1}.step .ar{color:var(--mut)}
.step.done{opacity:.55}.step.done .ar{color:var(--ok)}
#typing{height:20px;font-size:12px;color:var(--mut);padding:0 18px}
#composer{padding:0 16px 4px}
#composer form{display:flex;background:#1a1a1e;border:1px solid var(--line);border-radius:10px;align-items:flex-end}
#composer textarea{background:none;border:0;resize:none;max-height:180px;padding:12px 4px}
#composer .cb{color:var(--mut);padding:11px 12px}#composer .cb:hover{color:var(--tx)}
#preview{display:flex;gap:8px;padding:8px 0 0}#preview img{height:80px;border-radius:6px}
/* friends */
.flist{padding:16px 24px;flex:1;overflow-y:auto}
.fhead{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.frow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px;border-top:1px solid #ffffff08;cursor:pointer}
.frow:hover{background:var(--hover)}.frow .n{flex:1;min-width:0}.frow .n b{display:block}.frow .n small{color:var(--mut);font-size:13px}
.rbtn{width:36px;height:36px;border-radius:50%;background:#1f1f24;color:var(--mut);display:flex;align-items:center;justify-content:center}
.rbtn:hover{color:#fff}.rbtn.g:hover{color:var(--ok)}.rbtn.r:hover{color:var(--bad)}
.emptyc{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:30px;flex-direction:column;gap:10px}
.addf h2{font-size:16px;text-transform:uppercase;margin-bottom:6px}.addf p{color:var(--mut);font-size:14px;margin-bottom:14px}
.addf .bx{display:flex;gap:8px;background:#0e0e10;border:1px solid var(--line);border-radius:8px;padding:6px}
.addf .bx input{border:0;background:none}
.actcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center}
.actcard b{display:block;margin-bottom:6px}.actcard p{color:var(--mut);font-size:13px}
/* members */
.mem{display:flex;gap:12px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.mem:hover{background:var(--hover)}.mem .n{font-size:15px;font-weight:500}.mem.off{opacity:.4}
.mhead{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;padding:14px 8px 4px}
.tag{font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;background:#fbbf24;color:#000;margin-left:4px;vertical-align:middle}
.tag.dev{background:var(--acc);color:#fff}.tag.mod{background:var(--ok);color:#fff}
/* modal */
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50}
.mcard{background:#18181b;border:1px solid var(--line);border-radius:12px;width:min(460px,94vw);max-height:92vh;overflow-y:auto;padding:24px;position:relative}
.mcard h2{text-align:center;font-size:24px;margin-bottom:8px}.mcard p.sub{text-align:center;color:var(--mut);margin-bottom:18px;font-size:15px}
.mx{position:absolute;right:14px;top:12px;color:var(--mut);font-size:22px}.mx:hover{color:#fff}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:#1f1f24;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:8px;font-weight:600;text-align:left}
.opt:hover{background:#26262c}.opt .e{font-size:22px}.opt .sp{flex:1}.opt .ar{color:var(--mut)}
.mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.upl{width:84px;height:84px;border-radius:50%;border:2px dashed var(--mut);margin:6px auto 16px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;position:relative;background-size:cover;background-position:center}
.upl .plus{position:absolute;right:-2px;top:-2px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{width:32px;height:32px;border-radius:50%;border:2px solid transparent}.chips button.on{border-color:#fff}
/* popout */
#pop{position:fixed;z-index:45;width:340px;background:#141417;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px #000c}
#pop .bn{height:72px}
#pop .pa{margin:-40px 0 0 16px;border:6px solid #141417;border-radius:50%;width:92px;height:92px}
#pop .pb{padding:8px 16px 16px}
#pop h3{font-size:20px}#pop .hn{color:var(--mut);font-size:14px;margin-bottom:10px}
.pbox{background:#1c1c20;border:1px solid var(--line);border-radius:8px;padding:6px;margin-top:10px}
.pbox .it{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:6px;cursor:pointer;font-size:14px;color:#cfd1d5}
.pbox .it:hover{background:var(--hover);color:#fff}.pbox .it .sp{flex:1}
.pbox hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.pbio{font-size:13px;color:#cfd1d5;margin:8px 0;white-space:pre-wrap}.plab{font-size:12px;font-weight:700;color:var(--mut);margin-top:10px}
/* profile editor */
#prof{position:fixed;inset:0;background:var(--main);z-index:55;display:flex}
#prof .pl{width:300px;background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:0 12px 16px}
#prof .phead{position:sticky;top:0;background:var(--side);font-weight:700;font-size:17px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:10px;z-index:2}
.psec{margin-bottom:14px}.pst{font-size:14px;font-weight:700;margin-bottom:8px;color:#fff}
.tile.big{height:96px;border-radius:12px}.tile.dash{border-style:dashed}.tp{width:34px;height:34px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:800}
.bnbox{display:block;height:56px;border-radius:10px;cursor:pointer;border:1px solid var(--line)}.bnbox input,.tdot input{opacity:0;width:0;height:0;position:absolute}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.frames button{background:#1a1a1e;border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:6px}.frames button.on{border-color:var(--acc);color:#fff}
.fav{width:30px;height:30px;border-radius:50%;background:#3a3c42;display:block}
.plock{background:linear-gradient(180deg,#2a1b4d,#3b1f5e);border-radius:10px;padding:14px;margin:4px 0 12px;text-align:left;font-weight:600}.plock .lk{width:26px;height:26px;border-radius:50%;background:#000a;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.nlock{opacity:.5}
.nprev{margin-top:8px;background:#1a1a1e;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;font-size:22px;font-weight:800}
.theme{height:100px;border-radius:10px;position:relative;border:1px solid var(--line)}.tdot{position:absolute;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:8px;border:2px solid #fff;cursor:pointer}.tdot:first-child{top:8px}.tdot:last-child{bottom:8px}
#prof .pw{width:440px;overflow-y:auto;padding:40px 24px 24px 0}
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px}.ptabs button{padding:0 0 10px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent}.ptabs button.on{color:#fff;border-color:#fff}
.pempty{text-align:center;color:var(--mut);margin:30px 0 18px;font-size:13px}.pempty b{color:#fff;display:block;margin-bottom:6px}.pempty textarea{margin-top:10px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wg{background:#1a1a1e;border:1px solid var(--line);border-radius:10px;height:96px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;font-weight:700;color:#fff;font-size:14px;position:relative;overflow:hidden}.wg:hover{background:#222227}.wg .we{font-size:28px;opacity:.5;position:absolute;left:10px;top:8px}.wg .wt{display:flex;flex-direction:column;align-items:center;gap:4px;z-index:1}.wg .wp{width:24px;height:24px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center}.wg small{color:var(--mut);font-weight:500;font-size:11px}.wg.on{border-color:#3a3c42}
.pcard2{width:400px;background:#141417;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}

const monthKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1); };
function tierOf(uid) { const n = users[uid]?.nitro; if (!n || !TIERS[n.tier]) return null; if (n.until !== -1 && n.until < Date.now()) return null; return n.tier; }

function nitroBadge(uid) { const t = tierOf(uid); return t ? `<span class="nitro-b" title="${TIERS[t].name}">${TIERS[t].emoji}</span>` : ''; }

const untilTx = n => n.until === -1 ? 'navždy' : 'do ' + new Date(n.until).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });

/* ---------- helpers ---------- */
const isOwner = () => !!(me && me.email === OWNER_EMAIL && me.emailVerified);
const isDev = () => isOwner() || !!devs[me?.uid];
const banUntil = uid => bans[uid] === -1 ? Infinity : (bans[uid] || 0);
const isBanned = uid => banUntil(uid) > Date.now();
const myP = () => users[me?.uid] || {};
const nameOf = uid => users[uid]?.name || 'Neznámý';
function status(uid) { const u = users[uid]; if (u?.bot) return 'online'; if (!u || Date.now() - (u.seen || 0) > 150000) return 'offline'; const s = u.status || 'online'; return s === 'invisible' ? 'offline' : s; }
const STATUS_TX = { online: 'Online', idle: 'Nepřítomen', dnd: 'Nerušit', offline: 'Offline', invisible: 'Neviditelný' };
function avatar(uid, size = 40, withSt = false, ring = 'var(--side)') {
  const u = users[uid] || { name: '?', color: '#555' };
  const bg = u.avatar ? `background-image:url(${u.avatar});` : `background-color:${u.color || '#5865f2'};`;
  const st = withSt ? `<span class="st ${status(uid)}" style="width:${Math.max(10, size * .33)}px;height:${Math.max(10, size * .33)}px;border-color:${ring}"></span>` : '';
  const ring2 = FRAME_CSS[u.frame] && size >= 32 ? 'box-shadow:' + FRAME_CSS[u.frame] + ';' : perk(uid, 'avring') && size >= 32 ? 'box-shadow:0 0 0 2px #ff73fa,0 0 10px #ff73fa88;' : '';
  return `<div class="av" data-vav="${uid}" style="width:${size}px;height:${size}px;font-size:${size * .42}px;${bg}${ring2}">${u.avatar ? '' : esc((u.name || '?')[0].toUpperCase())}${st}</div>`;
}
const bannerCss = u => { if (u?.bannerImg) { const id0 = Object.keys(users).find(k => users[k] === u); if (id0 && perk(id0, 'banner')) return `url(${u.bannerImg}) center/cover`; } const b = u?.banner; if (b && b.startsWith('linear')) { const id = Object.keys(users).find(k => users[k] === u); if (id && !perk(id, 'banner')) return u.color || '#5865f2'; } return b || u?.color || '#5865f2'; };
const pairId = (a, b) => [a, b].sort().join('_');
const slug = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9_.]/g, '').slice(0, 24);
const isImg = v => typeof v === 'string' && v.startsWith('data:');
const srvIco = s => isImg(s.icon) ? `<img src="${s.icon}" alt="">` : esc(s.icon || initials(s.name));
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 4);
function readImage(file, max, q = .82) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function pickImage(max) { return new Promise(res => { const f = $('pickImg'); f.value = ''; f.onchange = async () => { if (!f.files[0]) return res(null); try { res(await readImage(f.files[0], max)); } catch { toast('❌ Obrázek nejde načíst'); res(null); } }; f.click(); }); }

const authErr = c => ({'auth/invalid-credential':'Špatný e-mail nebo heslo','auth/wrong-password':'Špatné heslo','auth/user-not-found':'Účet neexistuje','auth/email-already-in-use':'Tenhle e-mail už má účet','auth/weak-password':'Heslo musí mít aspoň 6 znaků','auth/invalid-email':'Neplatný e-mail','auth/too-many-requests':'Moc pokusů, zkus to za chvíli','auth/popup-closed-by-user':'Okno se zavřelo'}[c] || c);
async function handleFree(h, uid) { if (h.length < 2) return false; const s = await getDoc(D('dc_names', h)); return !s.exists() || s.data().uid === uid; }
async function doLogin() {
  const em = $('lemail').value.trim(), pw = $('lpass').value;
  $('lerr').textContent = '';

    if (regMode) {
      const nm = $('lname').value.trim(), h = slug($('luser').value);

async function setupUser(u, nm, want) {
  const ref = D('dc_users', u.uid), s = await getDoc(ref);
  const cur = s.exists() ? s.data() : {};
  const name = cur.name || nm || (u.email === OWNER_EMAIL ? 'Wolfe' : (u.displayName || (u.email || 'uživatel').split('@')[0])).slice(0, 32);
  let h = cur.handle;
  if (!h) {
    h = slug(want || name) || 'user';
    let tries = 0; while (!(await handleFree(h, u.uid)) && tries < 8) { h = slug(want || name).slice(0, 18) + Math.floor(Math.random() * 9000 + 1000); tries++; }
    await setDoc(D('dc_names', h), { uid: u.uid });
  }
  await setDoc(ref, { name, handle: h, color: cur.color || COLORS[Math.floor(Math.random() * COLORS.length)], seen: Date.now(), since: cur.since || Date.now(), status: cur.status || 'online' }, { merge: true });
}

function startApp() {

  unsub.g = onSnapshot(C('dc_globals'), s => {
    devs = {}; bans = {}; settings = {};
    s.forEach(d => { if (d.id === 'devs') devs = d.data(); if (d.id === 'bans') bans = d.data(); if (d.id === 'settings') settings = d.data(); });
    applyGlobals();
  });
  unsub.srv = onSnapshot(query(C('dc_servers'), where('members', 'array-contains', me.uid)), s => {
    servers = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.created || 0) - (b.created || 0));
    if (view !== 'home') { const n = servers.find(x => x.id === view); if (!n) goHome(); else { curSrv = n; } }
    renderRail(); if (view !== 'home') { renderSide(); renderTop(); renderRight(); }
  }, fail);
  unsub.fr = onSnapshot(query(C('dc_friends'), where('users', 'array-contains', me.uid)), s => {
    friends = s.docs.map(d => ({ id: d.id, ...d.data() }));
    renderRail(); if (view === 'home') { renderSide(); if (!curDm) { renderTop(); renderHomeMain(); } }
  });
  unsub.dm = onSnapshot(query(C('dc_channels'), where('members', 'array-contains', me.uid)), s => {
    dms = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.dm).sort((a, b) => (b.last || b.created || 0) - (a.last || a.created || 0));
    if (view === 'home') renderSide();
  });
  watchIncoming();
  const want = localStorage.getItem('dc_view');
  const hash = location.hash.match(/join=([\w-]+)/);
  if (hash) { history.replaceState(null, '', location.pathname); joinServer(hash[1]); }
  else if (want && want !== 'home') { setTimeout(() => { if (servers.find(x => x.id === want)) selectServer(want); else goHome(); }, 700); }
  goHome(true);
}

const fmtTime = t => { const d = new Date(t), n = new Date(), y = new Date(Date.now() - 864e5); const hm = d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }); return d.toDateString() === n.toDateString() ? 'Dnes v ' + hm : d.toDateString() === y.toDateString() ? 'Včera v ' + hm : d.toLocaleDateString('cs-CZ') + ' ' + hm; };

const botBusy = {};
async function botReply(bid, c, srv) {
  const b = users[bid]; if (!b?.bot || botBusy[bid + c.id]) return;
  botBusy[bid + c.id] = true;
  const typ = setInterval(() => setDoc(D('dc_typing', c.id), { [bid]: Date.now() }, { merge: true }).catch(() => {}), 2500);
  setDoc(D('dc_typing', c.id), { [bid]: Date.now() }, { merge: true }).catch(() => {});
  try {
    await new Promise(r => setTimeout(r, 400));
    const hist = msgs.filter(m => m.ch === c.id && m.text).slice(-14).map(m => ({ role: m.uid === bid ? 'assistant' : 'user', content: m.uid === bid ? m.text : `${nameOf(m.uid)}: ${m.text}` }));

    const r = await fetch('https://text.pollinations.ai/openai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'openai', messages: [{ role: 'system', content: sys }, ...hist] }) });
    if (!r.ok) throw new Error('AI ' + r.status);
    const j = await r.json();
    let t = (j.choices?.[0]?.message?.content || '').trim().replace(new RegExp('^' + b.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ':\\s*'), '');
    if (!t) t = '🤔 …';
    const d = { ch: c.id, uid: bid, text: censor(t).slice(0, 2000), t: Date.now(), bot: true, by: me.uid };
    if (srv) d.srv = srv;
    await addDoc(C('dc_messages'), d);
    if (c.dm) updateDoc(D('dc_channels', c.id), { last: Date.now() }).catch(() => {});
  } catch (e) { toast('🤖 Bot teď neodpovídá, zkus to za chvilku'); console.warn(e); }
  clearInterval(typ); setDoc(D('dc_typing', c.id), { [bid]: 0 }, { merge: true }).catch(() => {});
  delete botBusy[bid + c.id];
}
function botsToAnswer(c, t) {

  const hs = [...t.matchAll(/@([a-z0-9_.-]+)/gi)].map(m => m[1].toLowerCase());

const FRAMES = { '': 'Žádný', gold: 'Zlatý', neon: 'Neon', fire: 'Oheň', rainbow: 'Duha', ice: 'Led' };
const FRAME_CSS = { gold: '0 0 0 3px #ffd43b,0 0 12px #ffb300', neon: '0 0 0 3px #19e3ff,0 0 14px #19e3ff', fire: '0 0 0 3px #ff6a00,0 0 16px #ff2a00', rainbow: '0 0 0 3px #ff73fa,0 0 0 6px #5865f2,0 0 14px #57f287', ice: '0 0 0 3px #bfe9ff,0 0 14px #7fd3ff' };
const WIDGETS = [['fav', '🎮', 'Oblíbená hra'], ['like', '❤️', 'Hry, které se mi líbí'], ['loop', '🔁', 'Hry, které točím dokola'], ['want', '⭐', 'Chci si zahrát'], ['music', '🎵', 'Oblíbená hudba'], ['show', '📺', 'Oblíbený seriál']];
const themeCss = u => Array.isArray(u?.theme) && u.theme.length === 2 ? `linear-gradient(180deg,${u.theme[0]},${u.theme[1]})` : '';
function openProfileEditor() {
  const p = myP();
  let st = { name: p.name || '', handle: p.handle || '', pron: p.pron || '', bio: p.bio || '', avatar: p.avatar || '', banner: p.banner || '', bannerImg: p.bannerImg || '', color: p.color || '#5865f2', nameGrad: p.nameGrad || '', custom: p.custom || '', theme: Array.isArray(p.theme) ? p.theme.slice() : '', frame: p.frame || '', widgets: { ...(p.widgets || {}) }, wish: p.wish || '' };
  let tab = 'board', hideInfo = false;
  const nitroOk = perk(me.uid, 'grad'), bnOk = perk(me.uid, 'banner');
  const bnCss = () => st.bannerImg && bnOk ? `url(${st.bannerImg}) center/cover` : (st.banner || st.color);
  const card = () => { const th = themeCss(st); return `<div class="pcard2" style="${th ? 'background:' + th : ''}"><div class="bn" style="background:${bnCss()}"></div>
    <div class="pa"><div class="av" style="width:120px;height:120px;font-size:50px;${st.avatar ? `background-image:url(${st.avatar})` : `background-color:${st.color}`};${FRAME_CSS[st.frame] ? 'box-shadow:' + FRAME_CSS[st.frame] : ''}">${st.avatar ? '' : esc((st.name || '?')[0].toUpperCase())}<span class="st ${status(me.uid)}" style="width:30px;height:30px;border-color:#141417;border-width:5px"></span></div>
    <div class="bubble" id="pBub">${st.custom ? esc(st.custom) : '<span style="color:var(--dim)">⊕ Co máš na srdci?</span>'}</div></div>
    <div class="pb"><h2><span class="${nitroOk && st.nameGrad ? 'gname' : ''}" style="${nitroOk && st.nameGrad ? 'background-image:' + st.nameGrad : ''}">${esc(st.name || 'Jméno')}</span></h2>
    <div class="hl">${esc(st.handle)} • <span style="color:var(--dim)">${st.pron ? esc(st.pron) : 'Přidej zájmena'}</span> ${roleTag(me.uid)}</div>
    <div class="pbtns"><button class="btn sm" style="width:auto;margin:0;padding:8px 14px">💬 Zpráva</button><button class="ib">👥</button><button class="ib">⋯</button></div>
    ${hideInfo ? '' : `<div class="pinfo">Tvůj úplný profil vidí přátelé a lidé na tvých serverech. Kdykoli ho tu můžeš upravit.<button id="pInfoX">✕</button></div>`}
    <div class="plab">Bio</div><div class="pbio">${st.bio ? esc(st.bio) : '<i style="color:var(--dim)">Popiš se třemi smajlíky</i>'}</div>
    <div class="plab">Členem od</div><div class="pbio">${p.since ? new Date(p.since).toLocaleDateString('cs-CZ') : '—'}</div>
    <div class="plab">Propojení</div><div class="pbio" style="color:var(--mut)">＋ Přidat spojení</div>
    <div class="plab">Poznámka (viditelná pouze pro tebe)</div><div class="pbio" style="color:var(--dim)">Kliknutím přidej poznámku</div></div></div>`; };
  const board = () => {
    if (tab === 'act') return `<div class="pempty"><div style="font-size:42px">🕹️</div><b>Zatím žádná aktivita</b><p>Až budeš v hlasovém kanálu nebo psát zprávy, uvidíš to tady.</p></div>`;
    if (tab === 'wish') return `<div class="pempty" style="text-align:left"><b>🎁 Seznam přání</b><p>Napiš, co by sis přál (jedna věc na řádek).</p><textarea id="pWish" rows="8" maxlength="400" placeholder="Např. Minecraft, KSP...">${esc(st.wish)}</textarea></div>`;
    return `<div class="pempty"><b style="font-size:16px">Přizpůsob si svůj profil pomocí widgetů</b><p>Vyber si widget a poděl se o informace o sobě a svých zájmech</p></div>
      <div class="wgrid">${WIDGETS.map(([k, e, t]) => `<button class="wg ${st.widgets[k] ? 'on' : ''}" data-w="${k}"><span class="we">${e}</span><span class="wt">${st.widgets[k] ? `<small>${t}</small>${esc(st.widgets[k])}` : `<span class="wp">＋</span>${t}`}</span></button>`).join('')}</div>`;
  };
  const sec = (t, body) => `<div class="psec"><div class="pst">${t}</div>${body}</div>`;
  const lock = `<div class="plock"><div class="lk">🔒</div><div>Vyšperkuj svůj vzhled – pouze s <span style="color:#00a8fc">Nitrem</span></div><button class="btn sm" id="pNitroPrev" style="margin:10px 0 0">👁 Náhled Nitra</button></div>`;
  const draw = () => {
    $('prof').innerHTML = `<div class="pl"><div class="phead">Hlavní profil ⌄</div>
      ${sec('Zobrazované jméno', `<input id="pn" maxlength="32" value="${esc(st.name)}">`)}
      ${sec('Uživatelské jméno', `<input id="ph" maxlength="24" value="${esc(st.handle)}">`)}
      ${sec('Zájmena', `<input id="ppr" maxlength="20" placeholder="Přidej zájmena" value="${esc(st.pron)}">`)}
      ${sec('Avatar a vzhled', `<div class="row2"><div class="tile big" id="pAv">${st.avatar ? `<div class="av" style="width:72px;height:72px;background-image:url(${st.avatar})"></div>` : '<span class="tp">＋</span>'}</div><div class="tile big dash" id="pAvRm" title="Odebrat avatar">${st.avatar ? '🗑️' : '<span class="tp">＋</span>'}</div></div><div class="chips" style="margin-top:8px">${COLORS.map(c => `<button data-c="${c}" class="${c === st.color ? 'on' : ''}" style="background:${c}"></button>`).join('')}</div>`)}
      ${sec('Barva banneru', `<label class="bnbox" style="background:${st.banner || st.color}"><input type="color" id="pBnC" value="${/^#/.test(st.banner) ? st.banner : st.color}"></label><div class="chips" style="margin-top:8px">${BANNERS.filter(c => !c.startsWith('linear')).map(c => `<button data-bn="${c}" class="${c === st.banner ? 'on' : ''}" style="background:${c}"></button>`).join('')}</div>`)}
      ${sec('Efekt a rámeček profilu', `<div class="frames">${Object.entries(FRAMES).map(([k, v]) => `<button data-fr="${k}" class="${st.frame === k ? 'on' : ''}"><span class="fav" style="${FRAME_CSS[k] ? 'box-shadow:' + FRAME_CSS[k] : ''}"></span>${v}</button>`).join('')}</div>`)}
      ${sec('Status', `<input id="pcu" maxlength="60" placeholder="Co máš na srdci?" value="${esc(st.custom)}">`)}
      ${sec('Bio', `<textarea id="pbio" rows="3" maxlength="190" placeholder="Popiš se třemi smajlíky">${esc(st.bio)}</textarea>`)}
      ${nitroOk ? '' : lock}
      <div class="${nitroOk ? '' : 'nlock'}">
      ${sec('Styl zobrazovaného jména', `<div class="chips"><button data-ng="" class="${!st.nameGrad ? 'on' : ''}" style="background:#26262c">✕</button>${NAME_GRADS.map(g => `<button data-ng="${g}" class="${g === st.nameGrad ? 'on' : ''}" style="background:${g}"></button>`).join('')}</div><div class="nprev"><span class="${st.nameGrad ? 'gname' : ''}" style="${st.nameGrad ? 'background-image:' + st.nameGrad : ''}">${esc(st.name || 'Jméno')}</span></div>`)}
      ${sec('Motiv profilu', `<div class="theme" style="background:${themeCss(st) || '#1f1f24'}"><label class="tdot" style="background:${st.theme ? st.theme[0] : '#ff73fa'}"><input type="color" id="pT1" value="${st.theme ? st.theme[0] : '#c800ff'}"></label><label class="tdot" style="background:${st.theme ? st.theme[1] : '#57e0ff'}"><input type="color" id="pT2" value="${st.theme ? st.theme[1] : '#57e0ff'}"></label></div>${st.theme ? '<button class="link" id="pTx" style="font-size:12px">Odebrat motiv</button>' : ''}`)}
      ${sec('Banner profilu', `<div class="tile big" id="pBnImg" style="height:100px;${st.bannerImg ? `background-image:url(${st.bannerImg})` : ''}">${st.bannerImg ? '' : '🖼️ Nahrát obrázek'}</div>${st.bannerImg ? '<button class="link" id="pBnX" style="font-size:12px">Odebrat banner</button>' : ''}`)}
      </div>
      <button class="btn" id="psave">Uložit změny</button><button class="btn gray" id="pout">Odhlásit se</button></div>
      <div class="pr"><div id="pPrev">${card()}</div></div>
      <div class="pw"><div class="ptabs"><button data-pt="board" class="${tab === 'board' ? 'on' : ''}">Nástěnka</button><button data-pt="act" class="${tab === 'act' ? 'on' : ''}">Aktivita</button><button data-pt="wish" class="${tab === 'wish' ? 'on' : ''}">Seznam přání</button></div><div id="pBoard">${board()}</div></div>`;
    const P = $('prof');
    const live = () => { $('pPrev').innerHTML = card(); bindCard(); };
    const bindCard = () => { const x = $('pInfoX'); if (x) x.onclick = () => { hideInfo = true; live(); }; $('pBub').onclick = () => $('pcu').focus(); };
    bindCard();
    const bindBoard = () => {
      P.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const w = WIDGETS.find(x => x[0] === b.dataset.w); const v = prompt(w[2] + ' (prázdné = odebrat):', st.widgets[w[0]] || ''); if (v === null) return; if (v.trim()) st.widgets[w[0]] = v.trim().slice(0, 60); else delete st.widgets[w[0]]; $('pBoard').innerHTML = board(); bindBoard(); });
      const wi = $('pWish'); if (wi) wi.oninput = () => st.wish = wi.value;
    };
    bindBoard();
    P.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { tab = b.dataset.pt; draw(); });
    const needN = () => { toast('🔒 Tohle je jen s Yaper Nitro'); return true; };
    $('pn').oninput = () => { st.name = $('pn').value; live(); };
    $('ph').oninput = () => { st.handle = slug($('ph').value); live(); };
    $('ppr').oninput = () => { st.pron = $('ppr').value; live(); };
    $('pcu').oninput = () => { st.custom = $('pcu').value; live(); };
    $('pbio').oninput = () => { st.bio = $('pbio').value; live(); };
    $('pAv').onclick = async () => { const i = await pickImage(256); if (i) { st.avatar = i; draw(); } };
    $('pAvRm').onclick = async () => { if (st.avatar) { st.avatar = ''; draw(); } else { const i = await pickImage(256); if (i) { st.avatar = i; draw(); } } };
    P.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { st.color = b.dataset.c; draw(); });
    P.querySelectorAll('[data-bn]').forEach(b => b.onclick = () => { st.banner = b.dataset.bn; draw(); });
    $('pBnC').onchange = e => { st.banner = e.target.value; draw(); };
    P.querySelectorAll('[data-fr]').forEach(b => b.onclick = () => { st.frame = b.dataset.fr; draw(); });
    P.querySelectorAll('[data-ng]').forEach(b => b.onclick = () => { if (!nitroOk) return needN(); st.nameGrad = b.dataset.ng; draw(); });
    $('pT1').onchange = e => { if (!nitroOk) return needN(); st.theme = [e.target.value, st.theme ? st.theme[1] : '#57e0ff']; draw(); };
    $('pT2').onchange = e => { if (!nitroOk) return needN(); st.theme = [st.theme ? st.theme[0] : '#c800ff', e.target.value]; draw(); };
    if (!nitroOk) P.querySelectorAll('.nlock input').forEach(i => i.disabled = true);
    const tx = $('pTx'); if (tx) tx.onclick = () => { st.theme = ''; draw(); };
    $('pBnImg').onclick = async () => { if (!bnOk) return needN(); const i = await pickImage(640); if (i) { st.bannerImg = i; draw(); } };
    const bx = $('pBnX'); if (bx) bx.onclick = () => { st.bannerImg = ''; draw(); };
    const np = $('pNitroPrev'); if (np) np.onclick = openNitroPage;
    $('pout').onclick = () => { if (confirm('Odhlásit se?')) { closeProf(); signOut(auth); } };
    $('psave').onclick = async () => {
      if (st.name.trim().length < 2) { toast('Jméno musí mít aspoň 2 znaky'); return; }
      try {
        const d = { name: st.name.trim(), pron: st.pron.trim(), bio: st.bio.trim(), custom: st.custom.trim(), avatar: st.avatar, banner: st.banner, bannerImg: st.bannerImg, color: st.color, nameGrad: st.nameGrad, theme: st.theme || '', frame: st.frame, widgets: st.widgets, wish: st.wish.trim() };
        if (JSON.stringify(d).length > 900000) { toast('❌ Obrázky jsou moc velké'); return; }
        if (st.handle && st.handle !== p.handle) {
          if (!(await handleFree(st.handle, me.uid))) { toast('❌ Uživatelské jméno je zabrané'); return; }
          await setDoc(D('dc_names', st.handle), { uid: me.uid });
          if (p.handle) deleteDoc(D('dc_names', p.handle)).catch(() => {});
          d.handle = st.handle;
        }
        await updateDoc(D('dc_users', me.uid), d); toast('✅ Profil uložen'); closeProf();
      } catch (e) { fail(e); }
    };
  };
  draw();
  $('prof').classList.remove('hidden');
  let x = $('profX'); if (!x) { x = document.createElement('button'); x.id = 'profX'; x.textContent = '✕'; document.body.appendChild(x); }
  x.classList.remove('hidden'); x.onclick = closeProf;
}
function closeProf() { $('prof').classList.add('hidden'); const x = $('profX'); if (x) x.classList.add('hidden'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeProf(); $('pop').classList.add('hidden'); $('lightbox').classList.add('hidden'); $('dev').classList.add('hidden'); } });

/* ---------- DEV MENU ---------- */
function applyGlobals() {
  if (!me) return;
  if (isOwner() && !users[me.uid]?.owner) updateDoc(D('dc_users', me.uid), { owner: true }).catch(() => {});
  if (isOwner() && users[me.uid] && !(users[me.uid].nitro?.tier === 'nitro' && users[me.uid].nitro?.until === -1)) updateDoc(D('dc_users', me.uid), { nitro: { tier: 'nitro', until: -1, by: me.uid } }).catch(() => {});
  $('maint').classList.toggle('hidden', !(settings.maint && !isDev()));
  $('maintMsg').textContent = settings.maintMsg || 'Vylepšujeme Yaper, za chvíli jsme zpátky 🙂';
  if (!$('dev').classList.contains('hidden')) renderDev();
  renderTop(); renderRight();
}
let devTab = 'home', allServers = [];
async function openDev() { $('dev').classList.remove('hidden'); renderDev(); try { const s = await getDocs(C('dc_servers')); allServers = s.docs.map(d => ({ id: d.id, ...d.data() })); renderDev(); } catch (e) { fail(e); } }
$('devX').onclick = () => $('dev').classList.add('hidden');
const setG = (name, data) => setDoc(D('dc_globals', name), data, { merge: true }).catch(fail);
function fmtBan(uid) { const u = banUntil(uid); if (!u || u < Date.now()) return ''; return u === Infinity ? '<span class="chip r">PERMA</span>' : `<span class="chip r">ban do ${new Date(u).toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })}</span>`; }
function renderDev() {
  const own = isOwner();
  $('devRole').textContent = own ? '👑 Vlastník' : '🛠️ Dev';
  const tabs = [['home', '📊 Přehled'], ['users', '👥 Uživatelé'], ['bans', '⛔ Bany'], ['servers', '🌐 Servery']].concat(own ? [['maint', '🔧 Údržba']] : []);
  $('devTabs').innerHTML = tabs.map(([k, l]) => `<button data-t="${k}" class="${devTab === k ? 'on' : ''}">${l}</button>`).join('');
  $('devTabs').querySelectorAll('button').forEach(b => b.onclick = () => { devTab = b.dataset.t; renderDev(); });
  const uids = Object.keys(users), banned = uids.filter(isBanned);
  let h = '';
  if (devTab === 'home') h = `<div class="stats"><div class="stat"><b>${uids.length}</b><span>uživatelé</span></div><div class="stat"><b>${uids.filter(u => status(u) !== 'offline').length}</b><span>online</span></div><div class="stat"><b>${allServers.length}</b><span>servery</span></div><div class="stat"><b style="color:#ff8a8c">${banned.length}</b><span>bany</span></div></div><p style="color:var(--mut)">${own ? 'Jako vlastník můžeš dávat DEV, banovat navždy, mazat servery a zapnout údržbu.' : 'Jako dev můžeš mazat zprávy a dávat bany na 5 minut.'}</p>`;
  const userRow = uid => {
    const u = users[uid] || {}, prot = u.owner || uid === me.uid || (!own && devs[uid]);
    let b = '';
    if (!prot) {
      b += isBanned(uid) ? `<button class="chip g" data-unban="${uid}">Zrušit ban</button>` : `<button class="chip r" data-ban="${uid}" data-m="5">5 min</button>` + (own ? `<button class="chip r" data-ban="${uid}" data-m="60">1 h</button><button class="chip r" data-ban="${uid}" data-m="-1">Perma</button>` : '');
      if (own) b += `<button class="chip" data-nitro="${uid}" style="background:#ff73fa33;color:#ff9cf9">💎</button>`;
      if (own) b += devs[uid] ? `<button class="chip" data-undev="${uid}">Odebrat DEV</button>` : `<button class="chip y" data-dev="${uid}">Dát DEV</button>`;
    }
    return `<div class="drow">${avatar(uid, 30)}<span class="nm" style="color:${esc(u.color)}">${esc(u.name || '?')} <span style="color:var(--dim);font-size:12px">${esc(u.handle || '')}</span>${roleTag(uid)} ${status(uid) !== 'offline' ? '🟢' : ''} ${fmtBan(uid)}</span>${b}</div>`;
  };
  if (devTab === 'users') h = `<input id="devQ" placeholder="🔍 Hledat uživatele" value="${esc(window._dq || '')}" style="margin-bottom:8px">` + uids.filter(u => ((users[u].name || '') + (users[u].handle || '')).toLowerCase().includes((window._dq || '').toLowerCase())).sort((a, b) => (users[b].seen || 0) - (users[a].seen || 0)).map(userRow).join('');
  if (devTab === 'bans') h = banned.length ? banned.map(userRow).join('') : '<p style="color:var(--mut)">Nikdo nemá ban 🎉</p>';
  if (devTab === 'servers') h = allServers.length ? allServers.map(s => `<div class="drow"><span class="rb" style="width:36px;height:36px;font-size:12px">${srvIco(s)}</span><span class="nm">${esc(s.name)} <span style="color:var(--mut);font-size:12px">· ${(s.members || []).length} členů · majitel ${esc(users[s.owner]?.name || '?')}</span></span><button class="chip g" data-join="${s.id}">Vstoupit</button>${own ? `<button class="chip r" data-delsrv="${s.id}">Smazat</button>` : ''}</div>`).join('') : '<p style="color:var(--mut)">Zatím žádné servery</p>';
  if (devTab === 'maint' && own) h = `<p style="margin-bottom:10px">Údržba skryje chat všem kromě tebe a devů.</p><label class="l">Zpráva</label><input id="mMsg" value="${esc(settings.maintMsg || '')}" placeholder="Vylepšujeme Yaper, za chvíli jsme zpátky 🙂"><button class="btn ${settings.maint ? '' : 'red'}" id="mToggle" style="${settings.maint ? 'background:var(--ok)' : ''}">${settings.maint ? '✅ Vypnout údržbu' : '🔧 Zapnout údržbu'}</button>`;
  $('devBody').innerHTML = h;
  const B = $('devBody');
  const q = $('devQ'); if (q) q.oninput = () => { window._dq = q.value; renderDev(); const n = $('devQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  B.querySelectorAll('[data-ban]').forEach(b => b.onclick = () => { const m = +b.dataset.m; if (!own && m !== 5) return; setG('bans', { [b.dataset.ban]: m === -1 ? -1 : Date.now() + m * 60000 }); toast('⛔ Ban udělen'); });
  B.querySelectorAll('[data-nitro]').forEach(b => b.onclick = () => { $('dev').classList.add('hidden'); giveNitroModal(b.dataset.nitro); });
  B.querySelectorAll('[data-unban]').forEach(b => b.onclick = () => { setG('bans', { [b.dataset.unban]: 0 }); toast('✅ Ban zrušen'); });
  B.querySelectorAll('[data-dev]').forEach(b => b.onclick = () => { if (own) { setG('devs', { [b.dataset.dev]: true }); toast('🛠️ DEV přidán'); } });
  B.querySelectorAll('[data-undev]').forEach(b => b.onclick = () => { if (own) { setG('devs', { [b.dataset.undev]: false }); toast('DEV odebrán'); } });
  B.querySelectorAll('[data-join]').forEach(b => b.onclick = async () => { await updateDoc(D('dc_servers', b.dataset.join), { members: arrayUnion(me.uid) }).catch(fail); $('dev').classList.add('hidden'); setTimeout(() => selectServer(b.dataset.join), 500); });
  B.querySelectorAll('[data-delsrv]').forEach(b => b.onclick = async () => { if (!own || !confirm('Smazat server?')) return; try { const cs = await getDocs(query(C('dc_channels'), where('srv', '==', b.dataset.delsrv))); for (const c of cs.docs) await deleteDoc(c.ref); await deleteDoc(D('dc_servers', b.dataset.delsrv)); allServers = allServers.filter(x => x.id !== b.dataset.delsrv); renderDev(); toast('🗑️ Smazáno'); } catch (e) { fail(e); } });
  const mt = $('mToggle'); if (mt) mt.onclick = () => setG('settings', { maint: !settings.maint, maintMsg: $('mMsg').value.trim() });
}

$('center').addEventListener('click', () => { if (innerWidth <= 700) $('app').classList.add('closed'); });
</script>
</body>
</html>
